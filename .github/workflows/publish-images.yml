name: Publish images

# Builds the production images and pushes them to GitHub Container Registry once
# CI has passed on master, so a server only ever pulls a tested build:
#   ghcr.io/<owner>/shopping-cart-api   the Spring Boot API (Dockerfile)
#   ghcr.io/<owner>/shopping-cart-web   the storefront on Caddy (frontend/Dockerfile)
# Each is tagged with the commit SHA and `latest`, for linux/amd64 and linux/arm64,
# so x86 and ARM servers (Graviton, Ampere, ...) both run them natively.
# deploy/docker-compose.yml runs them (IMAGE_TAG picks the tag). The packages are
# public, like the repository, so a server pulls them without logging in; they
# hold the same code as the repository and no secrets.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    # Only after a successful CI run of a push to master (not of a pull request).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: shopping-cart-api
            context: .
            file: Dockerfile
          - image: shopping-cart-web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever master is by the time this runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # GHCR image names must be lowercase; the owner's login may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # Emulates arm64 on the amd64 runner, for the few steps of each image's final
      # stage; the jar and the storefront are built natively ($BUILDPLATFORM).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
