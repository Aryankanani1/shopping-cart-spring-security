# ===========================================================================
# BASE configuration — committed, safe shared defaults for EVERY environment.
# Only values that differ per environment live in application-{profile}.yml.
# Secrets are never stored here: they are read from environment variables and
# override these committed defaults via Spring's property precedence.
# ===========================================================================
spring:
  application:
    name: spring_security_demo

  # Prod unless another profile is chosen. Dev seeds admin accounts with a
  # password published in the README, so a deploy that forgets to pick a profile
  # must not fall back to it. Local runs opt in:  SPRING_PROFILES_ACTIVE=dev
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  # --- DataSource: connection details come from the environment ---
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP, set up for production and load-tested (README, "Load testing").
    hikari:
      pool-name: ShoppingCartHikariPool
      # Sized to the database server, not to the number of users: about (its CPU
      # cores x 2) + 1 per app instance, with every instance's pool together well
      # under MySQL's max_connections (151 by default). Requests beyond it wait in
      # Hikari's queue, cheaper than more connections competing for the same cores.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # No minimum-idle: a fixed-size pool (HikariCP's advice), so a burst after a
      # quiet spell doesn't wait for connections to be opened, and no idle-timeout.
      # How long a request waits for a free connection before it fails with a 503
      # and Retry-After (GlobalExceptionHandler). Seconds rather than the default 30,
      # so an overload turns some requests away quickly instead of holding a Tomcat
      # thread and a waiting user for half a minute each.
      connection-timeout: 5000
      # Each connection is retired after 30 minutes: well inside MySQL's wait_timeout
      # (8 hours by default) and any proxy's limit, so none is cut off while in use.
      max-lifetime: 1800000
      # Idle connections are pinged every 2 minutes, inside the idle timeouts of the
      # firewalls and load balancers that sit in front of a managed database.
      keepalive-time: 120000
      leak-detection-threshold: 20000
      # MySQL Connector/J: the same few statements run all the time, so each
      # connection caches them prepared, and the driver answers what it already knows
      # without a round trip (load-tested: p95 about a third lower). Prepared on the
      # client, not the server (useServerPrepStmts stays off): server-side ones
      # measured no faster here, and each one counts against MySQL's global
      # max_prepared_stmt_count, which instances x pool size x 250 can reach.
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useLocalSessionState: true
        cacheServerConfiguration: true
        cacheResultSetMetadata: true
        maintainTimeStats: false

  # --- Spring Data web: pagination request binding ---
  # Spring MVC binds Pageable from page/size/sort query params automatically.
  # max-page-size is a hard cap: a client asking for ?size=100000 is clamped to
  # 100, so a single request can never ask the DB for an unbounded result set.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # --- Multipart uploads (admin product images, POST /images) ---
  # Spring's default 1MB-per-file cap rejects ordinary product photos. These caps
  # still bound what one request can push into memory and the DB (images are
  # stored as BLOBs); an over-limit upload is rejected with 413.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  # --- Flyway: versioned schema migrations own the DDL in every environment ---
  # Migrations live in classpath:db/migration (V1__baseline.sql, V2__…). Hibernate
  # never mutates the schema now; it only validates against it (see ddl-auto per
  # profile). baseline-on-migrate lets Flyway adopt a pre-existing database (e.g. a
  # dev schema previously built by ddl-auto: update) by stamping it at the baseline
  # version instead of failing on the non-empty schema.
  flyway:
    enabled: true
    baseline-on-migrate: true

  # --- JPA / Hibernate: settings that are correct in all environments ---
  jpa:
    # Close the persistence context at the transaction boundary: surfaces
    # LazyInitializationException early and prevents N+1 during serialization.
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # Turn a would-be N+1 on lazy associations into a single IN (...) query.
        default_batch_fetch_size: 20
        # Batch updates and deletes. Inserts aren't batched: ids are AUTO_INCREMENT
        # (IDENTITY), so Hibernate inserts each row as it is saved to learn its id.
        # Ids came from sequence tables before V9; see that migration for why not.
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

# --- Actuator: operational endpoints for health checks and metrics ---
# Only health/info/metrics/prometheus are exposed over HTTP (never the full set).
# Only /actuator/health is public (see ShopConfig) so load balancers and Kubernetes
# liveness/readiness probes can reach it; info and metrics are admin-only, and
# prometheus is admin-only unless the scrape account below is switched on.
management:
  endpoints:
    # Defense in depth: every endpoint is switched off unless enabled below, and
    # none may offer write operations. So widening the exposure list (say, to "*")
    # can never bring up env, heapdump, threaddump, loggers or shutdown.
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    info:
      access: read-only
    metrics:
      access: read-only
    prometheus:
      access: read-only
    health:
      access: read-only
      probes:
        enabled: true          # exposes /actuator/health/{liveness,readiness}
      show-details: when-authorized
      # Who counts as "authorized" for the details (database, disk space). Without
      # this, any signed-in customer would see them.
      roles: ROLE_ADMIN
  # What /actuator/info shows, besides the build info (version, build time) that
  # the spring-boot-maven-plugin build-info goal writes.
  info:
    java:
      enabled: true            # Java version and vendor
    process:
      enabled: true            # pid, CPUs, memory
  metrics:
    # Label every series with the app's name, so one Prometheus can tell apps apart.
    tags:
      application: ${spring.application.name}
    # Latency buckets for HTTP requests, so Prometheus can compute percentiles
    # (histogram_quantile) across instances.
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Base path prefix for all REST controllers (e.g. /api/v1/products).
api:
  prefix: /api/v1

# --- JWT (see AuthTokenProperties) ---
# jwtSecret has NO committed default — it must be supplied via JWT_SECRET.
# Base64 key, >= 256 bits for HS256:  openssl rand -base64 32
# Access token is short-lived (15 min); sessions are kept alive with a
# longer-lived but revocable refresh token (7 days) — see RefreshTokenService.
auth:
  token:
    jwtSecret: ${JWT_SECRET}
    expirationInMils: ${JWT_EXPIRATION_MS:900000}
    refreshExpirationInMils: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    # Scheduled purge of expired refresh tokens (Spring cron). Runs at an off-peak
    # wall-clock time; ShedLock guarantees only one instance runs it. Default: daily 03:00.
    cleanupCron: ${JWT_CLEANUP_CRON:0 0 3 * * *}

# --- Startup pipeline (see StartupProperties) + rate limiting (RateLimitProperties) ---
app:
  # Rate limiting protects the unauthenticated auth endpoints (/auth/**) from
  # brute-force / credential stuffing. Token bucket: `capacity` requests may
  # burst, then the bucket refills to full over `refill-period`. Applied per
  # client IP by RateLimitFilter; over-limit callers get 429 + Retry-After. Tight
  # defaults because only login/refresh/logout are guarded — a real client makes
  # a handful of calls, an attacker makes thousands.
  ratelimit:
    enabled: true
    capacity: 5
    refill-period: 1m
    # Scheduled sweep of buckets that have refilled to full (bounds memory), as a
    # fixed rate in ms. Non-critical/idempotent, so a plain rate is fine. Hourly.
    eviction-interval-ms: ${APP_RATELIMIT_EVICTION_INTERVAL_MS:3600000}
  # Prometheus scrape account (see PrometheusScrapeSecurityConfig). Prometheus
  # can't log in for a JWT, so when this is on it reads /actuator/prometheus with
  # HTTP Basic, using this account, which can't access anything else. Off by
  # default; turning it on requires PROMETHEUS_SCRAPE_PASSWORD (16-72 characters).
  metrics:
    prometheus:
      scrape-enabled: ${PROMETHEUS_SCRAPE_ENABLED:false}
      username: ${PROMETHEUS_SCRAPE_USERNAME:prometheus}
      password: ${PROMETHEUS_SCRAPE_PASSWORD:}
  # First admin account (see AdminBootstrap). Outside dev there is no other way to
  # get one: sign-up makes customers, and the dev seeder's admins are dev-only.
  # Off while ADMIN_EMAIL is empty. ADMIN_PASSWORD (12-72 characters) is only used
  # to create the account; an existing account keeps its password, so remove it
  # from the environment once the first start has created the admin.
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  # Browser origins allowed to call the API cross-origin (CORS, see CorsConfig),
  # comma-separated exact origins, e.g. https://shop.example.com. Empty by default:
  # no CORS headers, so the frontend must be served from the same host as /api.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  # Optional feature modules (see WishlistModule). Turning one off removes its
  # endpoints, services and scheduled jobs; every other module is always on.
  modules:
    wishlist:
      enabled: ${APP_MODULES_WISHLIST_ENABLED:true}
  # Wishlist reminder + price/stock alert scan (WishlistAlertJob). Spring cron,
  # every minute by default so a reminder fires within a minute of its time;
  # ShedLock makes only one instance run each tick. "-" disables it.
  wishlist:
    alert-cron: ${APP_WISHLIST_ALERT_CRON:0 * * * * *}
  # Retries refunds still owed (RefundRetryJob): ones the attempt right after the
  # cancellation couldn't finish. Spring cron, every minute (at :30, off the wishlist
  # scan's beat) by default; ShedLock makes only one instance run each tick.
  # Unpaid orders: checkout reserves the stock, so an order left unpaid this long is
  # cancelled and its items go back on sale (UnpaidOrderExpiryJob, every minute at
  # :45, ShedLock). The order's payBy shows the customer the deadline.
  orders:
    unpaid-expiry: ${APP_ORDERS_UNPAID_EXPIRY:30m}
    unpaid-expiry-cron: ${APP_ORDERS_UNPAID_EXPIRY_CRON:45 * * * * *}
  payment:
    refund-retry-cron: ${APP_PAYMENT_REFUND_RETRY_CRON:30 * * * * *}
    # Settles payments still PROCESSING after 2 minutes (PaymentReconciliationJob)
    # by asking the provider what happened. Every minute, at :15; ShedLock too.
    reconcile-cron: ${APP_PAYMENT_RECONCILE_CRON:15 * * * * *}
    # Webhooks (PaymentWebhookController): the provider signs each with this secret
    # (at least 32 characters; openssl rand -hex 32), and one signed more than
    # webhook-tolerance away from now is refused as a replay. Empty: webhooks off.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    webhook-tolerance: 5m
    fake:
      # Where the simulated provider delivers its webhooks (the API's own endpoint).
      # Empty: it sends none.
      webhook-url: ${APP_PAYMENT_FAKE_WEBHOOK_URL:}
      # How long each of its calls takes, like a real provider's round trip. 0 (the
      # default) answers at once; the load test (load/checkout.js) raises it.
      latency: ${APP_PAYMENT_FAKE_LATENCY:0ms}
  startup:
    seed:
      enabled: true
      products-enabled: true
      categories: Electronics,Books,Clothing,Home & Kitchen,Toys,Sports,Beauty,Groceries
    connectivity:
      # Comma-separated external endpoints to verify at boot (empty = DB only).
      endpoints: ${APP_STARTUP_CONNECTIVITY_ENDPOINTS:}
      timeout-ms: 3000
    cache:
      warmup-enabled: true
