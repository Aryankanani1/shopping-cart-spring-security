# ===========================================================================
# TEST profile: the integration tests (@Tag("integration"), @ActiveProfiles("test")).
# The database is MySQL 8.4 in a container that Testcontainers starts on the first
# connection and keeps for the whole test run (Docker is required), with the real
# Flyway migrations and ddl-auto: validate, as in dev and production. Every test
# context in the run shares it, so tests set up (and clear) their own data. The
# dev seeder (@Profile("dev")) does not run under this profile.
# ===========================================================================
spring:
  datasource:
    url: jdbc:tc:mysql:8.4:///shop?TC_DAEMON=true
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      # As in dev and production: Flyway builds the schema, Hibernate checks that the
      # entities match it, so a missing migration fails the tests.
      ddl-auto: validate

# Base path prefix for all REST controllers (mirrors the base config).
api:
  prefix: /api/v1

# Deterministic secret for signing/validating JWTs in tests (Base64, 256-bit).
auth:
  token:
    jwtSecret: CEN/4/BWJAn9lZR7HK2RXAN+ejVVU7p4oBUm7RWtt5Q=
    expirationInMils: 3600000

# Keep the boot pipeline quiet and the database empty so each test controls its
# own fixtures: no category seeding, no cache warm-up.
app:
  # Off by default under test: the limiter is a singleton whose buckets outlive a
  # single test, so leaving it on would let repeated logins across the suite trip
  # the limit and fail unrelated tests. The dedicated RateLimitFilterTest turns it
  # back on (with a low capacity) via @TestPropertySource, in its own context.
  ratelimit:
    enabled: false
  # Off under test ("-" disables the cron): a background run could race a test
  # that drives WishlistAlertService directly. Tests call the service themselves.
  wishlist:
    alert-cron: "-"
  startup:
    seed:
      enabled: false
    cache:
      warmup-enabled: false
