# Loads the dashboards in monitoring/grafana/dashboards (mounted at
# /etc/grafana/dashboards). Edits made in the UI aren't saved back: change the
# JSON file instead, or save a copy under another name.
apiVersion: 1

providers:
  - name: shopping-cart
    folder: Shopping Cart
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
