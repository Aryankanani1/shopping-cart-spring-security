# ===========================================================================
# PROD profile — only what differs from the base for production.
# All connection details and secrets come from the environment (see base file);
# nothing sensitive is committed here.
# ===========================================================================
spring:
  jpa:
    # Never auto-mutate a production schema — migrations own the DDL. Validate
    # that the entities match the existing schema and fail fast if they don't.
    hibernate:
      ddl-auto: validate
    # Keep SQL logging off in production.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

# Turn off the API docs in production: the OpenAPI spec and Swagger UI describe
# every endpoint and schema, which is helpful in dev but needless attack surface
# in prod. Disabled here rather than in the base so local/dev still serves them.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Never expose health internals (DB, disk, versions) to callers in production,
# even authenticated ones — the probe just needs UP/DOWN.
management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.query: WARN
