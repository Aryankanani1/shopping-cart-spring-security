# ===========================================================================
# BASE configuration — committed, safe shared defaults for EVERY environment.
# Only values that differ per environment live in application-{profile}.yml.
# Secrets are never stored here: they are read from environment variables and
# override these committed defaults via Spring's property precedence.
# ===========================================================================
spring:
  application:
    name: spring_security_demo

  # Dev by default for local runs. Activate prod with:  SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # --- DataSource: connection details come from the environment ---
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP — size to the DB's real capacity, not "big".
    hikari:
      pool-name: ShoppingCartHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  # --- Spring Data web: pagination request binding ---
  # Spring MVC binds Pageable from page/size/sort query params automatically.
  # max-page-size is a hard cap: a client asking for ?size=100000 is clamped to
  # 100, so a single request can never ask the DB for an unbounded result set.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # --- Flyway: versioned schema migrations own the DDL in every environment ---
  # Migrations live in classpath:db/migration (V1__baseline.sql, V2__…). Hibernate
  # never mutates the schema now; it only validates against it (see ddl-auto per
  # profile). baseline-on-migrate lets Flyway adopt a pre-existing database (e.g. a
  # dev schema previously built by ddl-auto: update) by stamping it at the baseline
  # version instead of failing on the non-empty schema.
  flyway:
    enabled: true
    baseline-on-migrate: true

  # --- JPA / Hibernate: settings that are correct in all environments ---
  jpa:
    # Close the persistence context at the transaction boundary: surfaces
    # LazyInitializationException early and prevents N+1 during serialization.
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # Turn a would-be N+1 on lazy associations into a single IN (...) query.
        default_batch_fetch_size: 20
        # Batch writes — works because ids use SEQUENCE with a pooled optimizer.
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

# --- Actuator: operational endpoints for health checks and metrics ---
# Only health/info/metrics are exposed over HTTP (never the full set). Only
# /actuator/health is public (see ShopConfig) so load balancers and Kubernetes
# liveness/readiness probes can reach it; everything else requires authentication.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      probes:
        enabled: true          # exposes /actuator/health/{liveness,readiness}
      show-details: when-authorized

# Base path prefix for all REST controllers (e.g. /api/v1/products).
api:
  prefix: /api/v1

# --- JWT (see AuthTokenProperties) ---
# jwtSecret has NO committed default — it must be supplied via JWT_SECRET.
# Base64 key, >= 256 bits for HS256:  openssl rand -base64 32
# Access token is short-lived (15 min); sessions are kept alive with a
# longer-lived but revocable refresh token (7 days) — see RefreshTokenService.
auth:
  token:
    jwtSecret: ${JWT_SECRET}
    expirationInMils: ${JWT_EXPIRATION_MS:900000}
    refreshExpirationInMils: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    # Scheduled purge of expired refresh tokens (Spring cron). Runs at an off-peak
    # wall-clock time; ShedLock guarantees only one instance runs it. Default: daily 03:00.
    cleanupCron: ${JWT_CLEANUP_CRON:0 0 3 * * *}

# --- Startup pipeline (see StartupProperties) + rate limiting (RateLimitProperties) ---
app:
  # Rate limiting protects the unauthenticated auth endpoints (/auth/**) from
  # brute-force / credential stuffing. Token bucket: `capacity` requests may
  # burst, then the bucket refills to full over `refill-period`. Applied per
  # client IP by RateLimitFilter; over-limit callers get 429 + Retry-After. Tight
  # defaults because only login/refresh/logout are guarded — a real client makes
  # a handful of calls, an attacker makes thousands.
  ratelimit:
    enabled: true
    capacity: 5
    refill-period: 1m
    # Scheduled sweep of buckets that have refilled to full (bounds memory), as a
    # fixed rate in ms. Non-critical/idempotent, so a plain rate is fine. Hourly.
    eviction-interval-ms: ${APP_RATELIMIT_EVICTION_INTERVAL_MS:3600000}
  startup:
    seed:
      enabled: true
      products-enabled: true
      categories: Electronics,Books,Clothing,Home & Kitchen,Toys,Sports,Beauty,Groceries
    connectivity:
      # Comma-separated external endpoints to verify at boot (empty = DB only).
      endpoints: ${APP_STARTUP_CONNECTIVITY_ENDPOINTS:}
      timeout-ms: 3000
    cache:
      warmup-enabled: true
