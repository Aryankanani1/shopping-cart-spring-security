# ===========================================================================
# Staging: the production setup (docker-compose.yml, Caddyfile) with a MySQL
# container standing in for the managed database. The CI/CD pipeline starts it
# on the runner for every build, runs the end-to-end tests against it, and
# removes it again; nothing is kept. Its .env is generated by the pipeline, with
# SITE_ADDRESS=localhost (Caddy serves that with its own certificate authority).
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
# ===========================================================================

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      retries: 60

  api:
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The end-to-end tests sign in more often than the production limit of 5
      # per minute from one address allows; the limit itself has its own
      # integration test (RateLimitFilterTest).
      APP_RATELIMIT_CAPACITY: "50"
